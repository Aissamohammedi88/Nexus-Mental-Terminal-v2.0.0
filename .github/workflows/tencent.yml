# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS MENTAL TERMINAL — INFRASTRUCTURE MANIFEST
# ═══════════════════════════════════════════════════════════════════════════════
# 
# "Build small, document completely, inspect directly."
#                                         — Simon Willison
#
# This manifest is not a sales pitch. It is a contract. Every claim is verifiable.
# Every limitation is documented. Every example is executable.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ─── ANCHORS (DRY: Don't Repeat Yourself) ─────────────────────────────────────
# We define reusable blocks once, then reference them. This eliminates copy-paste
# errors and makes the manifest maintainable.

# @anchor: core_metadata
_meta: &core_metadata
  version: "2.1.0"           # Semantic Versioning: MAJOR.MINOR.PATCH
  author: "Aissa Mohammedi (@Aissamohammedi88)"
  author_url: "https://github.com/Aissamohammedi88"
  license: "NEXUS-OPEN-2.0"
  last_updated: "2026-10-24"
  repository: "https://github.com/Aissamohammedi88/nexus-mental-terminal"
  # Transparency: this manifest itself is versioned and dated.

# @anchor: safety_guarantees
_safety: &safety_guarantees
  real_system_access: false
  network_commands: false
  disk_access: false
  execution_environment: "RAM-only sandbox"
  # A warning is mandatory. Willison style: never hide the sharp edges.
  warning: |
    THIS IS NOT A REAL SECURITY SANDBOX. It is a simulator.
    For true isolation, use Docker, Firejail, or bubblewrap.
  # If you break it, you fix it. No warranty.

# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS MENTAL TERMINAL
# ═══════════════════════════════════════════════════════════════════════════════

nexus_mental_terminal:
  <<: *core_metadata  # Merge the metadata block.
  
  description: >
    A 100% in-memory virtual terminal for AI agents. 
    Simulates a complete Ubuntu/Unix environment without accessing the real system.
    
  purpose: >
    A safe sandbox for LLMs to test commands, prototype workflows, 
    and learn Unix/Linux without risk.

  # ─── SAFETY PROFILE (The Contract) ──────────────────────────────────────────
  safety_profile:
    <<: *safety_guarantees

  # ─── CAPABILITIES (What it does) ────────────────────────────────────────────
  capabilities:
    shell:
      type: "bash"
      commands_count: 100+          # This number is a floor, not a ceiling.
      features:
        - pipelines "|"
        - redirections "> < >>"
        - operators "; && ||"
    
    filesystem:
      type: "Virtual FHS"           # Filesystem Hierarchy Standard
      directories:
        - "/home/user"
        - "/etc"
        - "/usr"
        - "/var"
        - "/proc"
        - "/sys"
        - "/root"
        - "/opt"
        - "/srv"
        - "/mnt"
        - "/media"
        - "/boot"
      storage: "RAM only"           # No persistence. Everything dies on close.
      persistence_warning: >
        Nothing survives a session restart. This is by design.

    package_managers:
      apt:
        commands: ["install", "remove", "update", "upgrade", "search", "show", "list"]
        additional: ["apt-cache", "dpkg", "add-apt-repository"]
        ppas_available: 14
      snap:
        commands: ["install", "remove", "list", "find"]
        packages_simulated: 15
      flatpak:
        commands: ["install", "remove", "list", "remotes"]
        apps_simulated: 8
    
    systemd:
      commands: ["start", "stop", "restart", "enable", "disable", "status", "list-units"]
      additional: ["journalctl", "service"]
    
    linux_kernels:
      variants: 11
      types: ["generic", "lowlatency", "kvm", "aws", "azure", "gcp", "oracle", "oem", "hwe", "raspi", "liquorix"]
    
    python_repl:
      type: "persistent"
      integration: true
    
    syscalls:
      - "uname"
      - "getpid"
      - "getuid"
      - "getgid"

  # ─── COMMANDS (The Inventory) ───────────────────────────────────────────────
  # Organized by category. Every command is a promise.
  command_categories:
    files: ["ls", "cd", "pwd", "mkdir", "rmdir", "rm", "cp", "mv", "cat", "touch", "tree", "stat", "file", "du", "find"]
    text: ["echo", "printf", "head", "tail", "wc", "grep", "sort", "uniq", "rev", "tac", "nl"]
    system: ["whoami", "hostname", "uname", "date", "uptime", "id", "ps", "top", "df", "free"]
    environment: ["env", "export", "set", "unset", "alias", "history", "clear"]
    ubuntu: ["apt", "apt-get", "apt-cache", "dpkg", "add-apt-repository"]
    snap: ["snap"]
    flatpak: ["flatpak"]
    hash: ["md5sum", "sha256sum", "base64"]
    math: ["expr", "bc", "factor"]
    misc: ["uuidgen", "cal", "basename", "dirname", "readlink", "sleep", "seq", "yes"]

  # ─── PPA SUPPORT (The Risk Matrix) ──────────────────────────────────────────
  # We list the risk level for every PPA. You deserve to know.
  ppas_supported:
    - name: "canonical-kernel-team/unstable"
      category: "kernel"
      risk: "high"
    - name: "canonical-hwe-team/experimental-next"
      category: "kernel"
      risk: "high"
    - name: "damentz/liquorix"
      category: "kernel"
      risk: "medium"
    - name: "graphics-drivers/ppa"
      category: "graphics"
      risk: "medium"
    - name: "ubuntu-toolchain-r/test"
      category: "toolchain"
      risk: "medium"
    - name: "deadsnakes/ppa"
      category: "python"
      risk: "low"
    - name: "git-core/ppa"
      category: "vcs"
      risk: "low"
    - name: "ondrej/php"
      category: "php"
      risk: "low"
    - name: "ondrej/nginx"
      category: "web"
      risk: "low"
    - name: "neovim-ppa/unstable"
      category: "editor"
      risk: "low"

  # ─── INTEGRATION (The API Contract) ─────────────────────────────────────────
  integration:
    library_mode:
      import: "from nexus_mental import MentalTerminal"
      examples:
        - "t.bash('ls -la /etc')"
        - "t.python('sum(range(100))')"
        - "t.get_state()"
        - "t.stats()"
    
    tool_calling:
      class: "MentalTerminalTool"
      schema_method: "get_tool_schema()"
      execute_method: "execute_tool('mental_bash', {'command': 'apt list'})"
    
    installation:
      method: "git clone"
      url: "https://github.com/Aissamohammedi88/nexus-mental-terminal"
      dependencies: "Python stdlib only (no external deps)"
    
    python_version: ">=3.10"

  # ─── LIMITATIONS (The Truth) ────────────────────────────────────────────────
  # This is the most important section. Willison style: document the sharp edges.
  limitations:
    - "No persistence between sessions. Everything is lost when you close it."
    - "No real network access. curl, wget, and ping are simulated."
    - "No real disk access. All files exist only in RAM."
    - "Simulated in RAM only. Not a security sandbox."
    - "Do not confuse with a real terminal. It is a simulation."
    - "No GPU access. No real hardware acceleration."

  # ─── VERIFICATION (The Proof) ───────────────────────────────────────────────
  # Commands you can run to verify the claims in this manifest.
  verification:
    commands:
      - description: "Check Python version (must be >= 3.10)"
        command: "python3 --version"
      - description: "Check no external dependencies are needed"
        command: "python3 -c 'import nexus_mental; print(\"OK\")'"
      - description: "Verify the bash command count (must be >= 100)"
        command: "python3 -c 'from nexus_mental import MentalTerminal; t=MentalTerminal(); print(len(t.bash.commands))'"

  # ─── ROADMAP (The Plan) ─────────────────────────────────────────────────────
  roadmap:
    completed:
      - "v1.0: bash + vfs + python"
      - "v2.0: apt + snap + flatpak + systemd + PPAs"
      - "v2.1: systemd user + cgroups"
    planned:
      - "v2.2: docker/podman simulés"
      - "v3.0: noyaux Linux chargeables"
      - "v3.1: QEMU mental"
      - "v3.2: interface web (xterm.js)"

  # ─── LLM INTEGRATION NOTES (The Use Cases) ──────────────────────────────────
  llm_integration_notes: |
    Ideal for:
    - Training LLMs on Unix commands
    - Simulating CLI sessions for testing
    - Safe sandbox for generated code
    - Learning Linux/Ubuntu without risk
    - Prototyping DevOps workflows
    
    Limitations to know:
    - No persistence between sessions
    - No real network access
    - Simulated in RAM only
    - Do not confuse with a real system terminal

  # ─── ATTRIBUTION (The License) ──────────────────────────────────────────────
  attribution_required: true
  warning_inclusion: "Pas de présentation comme système réel"
