# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS TERMINAL IA — MULTI-PLATFORM RELEASE PIPELINE
# Build, package, and release the AI Terminal integrator across 3 OS.
# ══════════════════════════════════════════════════════════════════════════════
name: Release Nexus Terminal IA

on:
  push:
    tags:
      - 'v*'   # Déclenché sur les tags de version (ex: v4.0.0)
  workflow_dispatch:

permissions:
  contents: write # Nécessaire pour créer la release GitHub

jobs:
  # ─── JOB 1 : SETUP (Extraction de la version) ─────────────────────────────────
  # Ce job est inspiré du "setup" de ncnn. Il extrait le numéro de version
  # du tag Git pour l'injecter dans les binaires et les noms d'archives.
  setup:
    name: "🔧 Setup & Extract Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.VERSION }}
      short_sha: ${{ steps.extract.outputs.SHORT_SHA }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from Tag
        id: extract
        run: |
          # Extrait la version du tag (ex: refs/tags/v4.0.0 -> 4.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Commit: $SHORT_SHA)"

  # ─── JOB 2 : BUILD MATRIX (3 OS × 2 Arch = 6 binaires) ──────────────────────
  # Inspiré de la matrice de ncnn. Chaque combinaison (OS, Arch) compile
  # le terminal et produit un binaire distinct.
  build:
    name: "🏗️ Build (${{ matrix.os }} / ${{ matrix.arch }})"
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux ---
          - os: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: nexus-terminal-linux-amd64
          - os: ubuntu-22.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            binary_name: nexus-terminal-linux-arm64
          
          # --- macOS ---
          - os: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
            binary_name: nexus-terminal-macos-amd64
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
            binary_name: nexus-terminal-macos-arm64
          
          # --- Windows ---
          - os: windows-2022
            arch: x86_64
            target: x86_64-pc-windows-msvc
            binary_name: nexus-terminal-windows-amd64.exe
          - os: windows-2022
            arch: aarch64
            target: aarch64-pc-windows-msvc
            binary_name: nexus-terminal-windows-arm64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (pour le build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Si le terminal utilise PyInstaller pour créer un binaire :
          pip install pyinstaller

      - name: Build Terminal Binary
        run: |
          # On utilise PyInstaller pour compiler le script Python en binaire natif
          pyinstaller --onefile \
            --name ${{ matrix.binary_name }} \
            --distpath dist/ \
            --workpath build/ \
            terminal/main.py
          
          # Vérification que le binaire existe
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 7

  # ─── JOB 3 : PACKAGE (Création des archives .tar.gz / .zip) ─────────────────
  # Ce job regroupe les binaires et les fichiers de configuration dans des
  # archives prêtes à être téléchargées.
  package:
    name: "📦 Package Artifacts"
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Archives
        run: |
          VERSION=${{ needs.setup.outputs.version }}
          mkdir -p release/
          
          # Pour Linux/macOS : .tar.gz
          for dir in artifacts/nexus-terminal-linux-* artifacts/nexus-terminal-macos-*; do
            if [ -d "$dir" ]; then
              BINARY_NAME=$(basename "$dir")
              tar -czf "release/${BINARY_NAME}-v${VERSION}.tar.gz" -C "$dir" .
            fi
          done
          
          # Pour Windows : .zip
          for dir in artifacts/nexus-terminal-windows-*; do
            if [ -d "$dir" ]; then
              BINARY_NAME=$(basename "$dir")
              (cd "$dir" && zip -r "../../release/${BINARY_NAME}-v${VERSION}.zip" .)
            fi
          done
          
          ls -la release/

      - name: Upload Release Archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: release/
          retention-days: 7

  # ─── JOB 4 : RELEASE (Publication sur GitHub Releases) ─────────────────────
  # Ce job final crée la release GitHub et y attache toutes les archives.
  release:
    name: "🚀 Publish GitHub Release"
    needs: [setup, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          name: "Nexus Terminal IA v${{ needs.setup.outputs.version }}"
          body: |
            ## 🧬 Nexus Terminal IA — Release v${{ needs.setup.outputs.version }}
            
            **Commit:** `${{ needs.setup.outputs.short_sha }}`
            
            ### 📦 Available Binaries
            - Linux (x86_64, aarch64)
            - macOS (Intel, Apple Silicon)
            - Windows (x86_64, ARM64)
            
            ### 🛠️ Installation
            Download the archive for your platform, extract it, and run the binary.
            
            ---
            *Built with ❤️ by Aissa Mohammedi (DGK)*
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
