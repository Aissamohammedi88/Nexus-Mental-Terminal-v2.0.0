name:TKE-Core
on:push
permissions:write-all
concurrency:group:${{github.ref}}
env:R:ccr.ccs.tencentyun.com/n/x
jobs:
  x:
    runs-on:ubuntu-latest
    strategy:matrix:{arch:[amd64,arm64]}
    steps:
    -uses:actions/checkout@v4
    -run:|
      echo "${{secrets.KUBECONFIG}}">~/.kube/config
      docker build-t $R:${{github.sha}}-${{matrix.arch}} .
      trivy image--exit-code 1 $R:${{github.sha}}-${{matrix.arch}}
      docker push $R:${{github.sha}}-${{matrix.arch}}
      kubectl set image deploy/x *=$R:${{github.sha}}-${{matrix.arch}}
