# ═══════════════════════════════════════════════════════════════════════════
# Nexus Mental Terminal v2.0.0 — CI/CD Pipeline for Tencent Kubernetes Engine
# ═══════════════════════════════════════════════════════════════════════════
name: Tencent Kubernetes Engine

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".gitignore", "LICENSE"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ignorer les tests (risqué)"
        required: false
        type: boolean
        default: false

env:
  TKE_REGISTRY: ccr.ccs.tencentyun.com
  TKE_IMAGE_URL: ccr.ccs.tencentyun.com/nexus/nexus-mental-terminal
  TKE_REGION: ap-guangzhou
  TKE_CLUSTER_ID: cls-nexus-mental
  DEPLOYMENT_NAME: nexus-mental-terminal
  NAMESPACE: nexus
  PYTHON_VERSION: "3.12"
  DOCKERFILE_PATH: ./Dockerfile
  CONTEXT_PATH: .

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: tencent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # JOB 1 : Qualité du code
  # ════════════════════════════════════════════════════════════════════════
  quality:
    name: "🔍 Qualité — Lint & Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 mypy black ruff

      - name: Verify structure
        run: |
          test -f pyproject.toml || (echo "::error::pyproject.toml manquant" && exit 1)
          test -d nexus_mental || (echo "::error::Package nexus_mental manquant" && exit 1)

      - name: Lint (flake8 & ruff)
        run: |
          flake8 nexus_mental/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 nexus_mental/ --count --max-line-length=127 --statistics
          ruff check nexus_mental/

      - name: Run tests
        if: ${{ !github.event.inputs.skip_tests }}
        run: pytest tests/ -v --tb=short

  # ════════════════════════════════════════════════════════════════════════
  # JOB 2 : Build Docker
  # ════════════════════════════════════════════════════════════════════════
  build:
    name: "🏗️ Build Docker"
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TKE_IMAGE_URL }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Login to Tencent Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TKE_REGISTRY }}
          username: ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }}
          password: ${{ secrets.TKE_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════
  # JOB 3 : Scan de Sécurité
  # ════════════════════════════════════════════════════════════════════════
  security:
    name: "🛡️ Scan Sécurité (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.TKE_IMAGE_URL }}:${{ needs.build.outputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fail le pipeline si critique

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ════════════════════════════════════════════════════════════════════════
  # JOB 4 : Déploiement sur TKE
  # ════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Déploiement TKE"
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag in manifests
        run: |
          # Si tu utilises kustomize :
          cd k8s/overlays/production
          kustomize edit set image ${{ env.TKE_IMAGE_URL }}=${{ env.TKE_IMAGE_URL }}:${{ needs.build.outputs.image_tag }}
          cd ../../..

      - name: Deploy to TKE Cluster
        run: |
          kubectl apply -k k8s/overlays/production -n ${{ env.NAMESPACE }}
          
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Post-deployment Smoke Test
        run: |
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }} -o jsonpath='{.items[0].metadata.name}')
          echo "Pod de test : ${POD}"
          
          kubectl exec -n ${{ env.NAMESPACE }} "${POD}" -- \
            python3 -c "from nexus_mental import MentalTerminal; \
                        t = MentalTerminal(); \
                        assert 'home' in t.bash('ls /').stdout; \
                        print('✅ Déploiement fonctionnel')"

      - name: Notify status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : 'failure',
              context: 'tencent-tke/deploy',
              description: `${emoji} Déploiement TKE ${status}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  # ════════════════════════════════════════════════════════════════════════
  # JOB 5 : Résumé Final
  # ════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Résumé du pipeline"
    runs-on: ubuntu-latest
    needs: [quality, build, security, deploy]
    if: always()
    steps:
      - name: Génération du résumé
        run: |
          {
            echo "## 🧠 Nexus Mental Terminal v2.0.0 — Pipeline TKE"
            echo ""
            echo "| Étape | Statut |"
            echo "|-------|--------|"
            echo "| Qualité (lint/tests) | ${{ needs.quality.result }} |"
            echo "| Build Docker | ${{ needs.build.result }} |"
            echo "| Scan sécurité | ${{ needs.security.result }} |"
            echo "| Déploiement | ${{ needs.deploy.result }} |"
            echo ""
            echo "**Tag d'image :** \`${{ needs.build.outputs.image_tag }}\`"
            echo "**Namespace :** \`${{ env.NAMESPACE }}\`"
            echo "**Cluster :** \`${{ env.TKE_CLUSTER_ID }}\` (\`${{ env.TKE_REGION }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
