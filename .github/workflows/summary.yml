# ═══════════════════════════════════════════════════════════════════════════════
# TENCENT KUBERNETES ENGINE (TKE) — TERMINAL MENTAL IA
# Multi-Arch Build (AMD64/ARM64) + Trivy Security Scan + Zero-Downtime Deploy.
# ═══════════════════════════════════════════════════════════════════════════════

name: TKE-Core Production

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Principe du moindre privilège. On n'utilise pas write-all.
permissions:
  contents: read
  packages: write

# Évite les déploiements concurrents sur la même branche
concurrency:
  group: tke-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TENCENT_REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: n/x
  K8S_DEPLOYMENT: x
  K8S_NAMESPACE: default

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 : BUILD, SCAN & PUSH MULTI-ARCH
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "🏗️ Build, Scan & Push"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build and Push (Multi-Arch)
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Crée une image unifiée contenant l'AMD64 et l'ARM64
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.TENCENT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.TENCENT_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.TENCENT_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Bloque le pipeline si faille CRITICAL ou HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : DEPLOY TO TKE (ZERO DOWNTIME)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to TKE"
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          # Décode le Kubeconfig encodé en base64 (sécurité)
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Connection to TKE
        run: kubectl get nodes

      - name: Deploy New Image
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            *=${TENCENT_REGISTRY}/${IMAGE_NAME}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          
      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Post-Deployment Status
        if: always()
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=${{ env.K8S_DEPLOYMENT }}
