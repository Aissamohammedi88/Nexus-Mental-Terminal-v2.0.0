# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS MENTAL TERMINAL
# A virtual, RAM-only Unix environment for AI agents.
# ═══════════════════════════════════════════════════════════════════════════════

project: "nexus_mental_terminal"
version: "2.0.0"
author: "Aissa Mohammedi (@Aissamohammedi88)"
license: "NEXUS-OPEN-2.0"
repository: "https://github.com/Aissamohammedi88/nexus-mental-terminal"
python_requires: ">=3.10"
dependencies: "none (Python standard library only)"

description: >
  A virtual Unix environment that lives entirely in RAM. It simulates a
  complete Ubuntu/Unix system — bash shell, filesystem, package managers,
  systemd — without touching the real host system.

purpose: >
  To provide a safe, deterministic sandbox where LLMs and developers can
  test commands, prototype workflows, and learn Unix/Linux without the
  risk of modifying a real machine.

safety:
  real_system_access: false
  network_commands: false
  disk_access: false
  execution_environment: "RAM-only"
  warning: >
    This is a SIMULATOR, not a security sandbox. For real isolation,
    use Docker, Firejail, or bubblewrap. Do not present this as a real
    operating system.

capabilities:
  shell:
    type: bash
    commands: 100+
    features:
      - "pipes (|)"
      - "redirections (>, <, >>)"
      - "operators (;, &&, ||)"
  filesystem:
    type: "Virtual FHS (Filesystem Hierarchy Standard)"
    root: "/"
    storage: "RAM only"
  package_managers:
    apt:
      commands: ["install", "remove", "update", "upgrade", "search", "show", "list"]
      tools: ["apt-cache", "dpkg", "add-apt-repository"]
      ppas_supported: 10
    snap:
      commands: ["install", "remove", "list", "find"]
      packages: 15
    flatpak:
      commands: ["install", "remove", "list", "remotes"]
      apps: 8
  systemd:
    commands: ["start", "stop", "restart", "enable", "disable", "status", "list-units"]
    tools: ["journalctl", "service"]
  kernels:
    variants: 11
    types: ["generic", "lowlatency", "liquorix", "aws", "azure", "gcp", "oracle", "oem", "hwe", "raspi", "kvm"]
  python_repl:
    type: "persistent"
  syscalls:
    - uname
    - getpid
    - getuid
    - getgid

commands:
  files: ["ls", "cd", "pwd", "mkdir", "rmdir", "rm", "cp", "mv", "cat", "touch", "tree", "stat", "file", "du", "find"]
  text: ["echo", "printf", "head", "tail", "wc", "grep", "sort", "uniq", "rev", "tac", "nl"]
  system: ["whoami", "hostname", "uname", "date", "uptime", "id", "ps", "top", "df", "free"]
  environment: ["env", "export", "set", "unset", "alias", "history", "clear"]
  ubuntu: ["apt", "apt-get", "apt-cache", "dpkg", "add-apt-repository"]
  snap: ["snap"]
  flatpak: ["flatpak"]
  hash: ["md5sum", "sha256sum", "base64"]
  math: ["expr", "bc", "factor"]
  misc: ["uuidgen", "cal", "basename", "dirname", "readlink", "sleep", "seq", "yes"]

ppas:
  - { name: "canonical-kernel-team/unstable", category: kernel, risk: high }
  - { name: "canonical-hwe-team/experimental-next", category: kernel, risk: high }
  - { name: "damentz/liquorix", category: kernel, risk: medium }
  - { name: "graphics-drivers/ppa", category: graphics, risk: medium }
  - { name: "ubuntu-toolchain-r/test", category: toolchain, risk: medium }
  - { name: "deadsnakes/ppa", category: python, risk: low }
  - { name: "git-core/ppa", category: vcs, risk: low }
  - { name: "ondrej/php", category: php, risk: low }
  - { name: "ondrej/nginx", category: web, risk: low }
  - { name: "neovim-ppa/unstable", category: editor, risk: low }

integration:
  library:
    import: "from nexus_mental import MentalTerminal"
    examples:
      - "t.bash('ls -la /etc')"
      - "t.python('sum(range(100))')"
      - "t.get_state()"
      - "t.stats()"
  tool_calling:
    class: MentalTerminalTool
    schema: get_tool_schema()
    execute: "execute_tool('mental_bash', {'command': 'apt list'})"
  install:
    method: "git clone"
    url: "https://github.com/Aissamohammedi88/nexus-mental-terminal"

roadmap:
  completed: ["v1.0 (bash, vfs, python)", "v2.0 (apt, snap, flatpak, systemd, ppas)"]
  planned:
    - "v2.1 (systemd user + cgroups)"
    - "v2.2 (docker/podman simulation)"
    - "v3.0 (loadable Linux kernels)"
    - "v3.1 (QEMU mental)"
    - "v3.2 (web interface via xterm.js)"

use_cases:
  - "Training LLMs on Unix commands"
  - "Simulating CLI sessions for testing"
  - "Safe sandbox for generated code"
  - "Learning Linux without risk"
  - "Prototyping DevOps workflows"

limitations:
  - "No persistence between sessions"
  - "No real network access"
  - "RAM-only simulation"
  - "Not a real system terminal"
