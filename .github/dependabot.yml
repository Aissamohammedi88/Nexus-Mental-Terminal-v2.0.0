# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS AUTOMATED DEPENDENCY MAINTENANCE
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Objectif : Maintenir les dépendances à jour sans polluer l'historique Git.
# Stratégie : 
#   - Regroupement des mises à jour mineures et correctives (1 PR / écosystème).
#   - Séparation stricte des mises à jour de sécurité (priorité absolue).
#   - Assignation automatique au mainteneur principal.
#   - Planification précise via CRON (évite les pics de charge).
# ═══════════════════════════════════════════════════════════════════════════════

version: 2

updates:
  # ─── 1. ÉCOSYSTÈME PYTHON (Noyau & API) ─────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 1" # Chaque lundi à 02:00 UTC (Heure creuse)
      timezone: "America/Montreal"
    assignees:
      - "Aissamohammedi88"
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # Regroupement intelligent pour éviter 50 Pull Requests
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Ignorer les mises à jour majeures pour les librairies critiques
    # (à décommenter si une librairie casse la compatibilité)
    # ignore:
    #   - dependency-name: "pydantic"
    #     update-types: ["version-update:semver-major"]

  # ─── 2. ACTIONS DU PIPELINE CI (Sécurité de la Supply Chain) ─────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * 1" # Lundi à 03:00 UTC (après Python)
      timezone: "America/Montreal"
    assignees:
      - "Aissamohammedi88"
    labels:
      - "dependencies"
      - "ci-cd"
      - "security"
    commit-message:
      prefix: "ci(deps):"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── 3. ÉCOSYSTÈME NODE.JS (Interface & Frontend) ──────────────────────────
  - package-ecosystem: "npm"
    directory: "/ui" # À ajuster selon l'emplacement de ton package.json
    schedule:
      interval: "cron"
      cronjob: "0 4 * * 1" # Lundi à 04:00 UTC
      timezone: "America/Montreal"
    assignees:
      - "Aissamohammedi88"
    labels:
      - "dependencies"
      - "node"
      - "automated"
    commit-message:
      prefix: "chore(ui-deps):"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── 4. ÉCOSYSTÈME DOCKER (Conteneurs & Déploiement) ───────────────────────
  - package-ecosystem: "docker"
    directory: "/" # Où se trouve ton Dockerfile
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/Montreal"
    assignees:
      - "Aissamohammedi88"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "build(deps):"
