# ═══════════════════════════════════════════════════════════════════════════
# Nexus Mental Terminal v2.0.0 — Configuration Dependabot
# ═══════════════════════════════════════════════════════════════════════════
#
# Projet     : Nexus Mental Terminal — Terminal virtuel en mémoire
# Auteur     : Aissa Mohammedi (DGK) — @Aissamohammedi88
# Licence    : NEXUS-OPEN-2.0
#
# Documentation officielle :
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/
# configuration-options-for-the-dependabot.yml-file
#
# Notes importantes pour ce projet :
#   • Nexus Mental Terminal n'a AUCUNE dépendance externe (stdlib Python
#     uniquement) — c'est une règle du CONTRIBUTING.md. Les mises à jour
#     "pip" seront donc limitées aux dépendances de développement
#     (pytest dans requirements-dev.txt si présent).
#   • Les écosystèmes activés ci-dessous couvrent :
#       - pip          → pyproject.toml / requirements*.txt (outils dev)
#       - github-actions → actions utilisées dans .github/workflows/
#       - docker       → Dockerfile (image de base)
# ═══════════════════════════════════════════════════════════════════════════

version: 2

updates:
  # ───────────────────────────────────────────────────────────────────────
  # 1. Python (pip) — dépendances de développement uniquement
  # ───────────────────────────────────────────────────────────────────────
  # Le cœur du projet utilise uniquement la stdlib Python.
  # Dependabot surveille néanmoins les outils de dev (pytest, flake8...)
  # s'ils sont déclarés dans pyproject.toml ou requirements-dev.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    # Limite le nombre de PRs ouvertes simultanément
    open-pull-requests-limit: 5
    # Étiquettes pour faciliter le triage des PRs
    labels:
      - "dependencies"
      - "python"
      - "dev-deps"
    # Regroupe les mises à jour mineures/patchs pour réduire le bruit
    groups:
      dev-dependencies:
        applies-to: "version-updates"
        patterns:
          - "pytest*"
          - "flake8*"
          - "mypy*"
          - "black"
          - "ruff*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    reviewers:
      - "Aissamohammedi88"

  # ───────────────────────────────────────────────────────────────────────
  # 2. GitHub Actions — mises à jour des actions du workflow CI/CD
  # ───────────────────────────────────────────────────────────────────────
  # Surveille toutes les actions utilisées dans .github/workflows/
  # (actions/checkout, actions/setup-python, docker/*, aquasecurity/trivy...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    # Regroupe toutes les mises à jour d'actions en une seule PR
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    reviewers:
      - "Aissamohammedi88"

  # ───────────────────────────────────────────────────────────────────────
  # 3. Docker — image de base du Dockerfile
  # ───────────────────────────────────────────────────────────────────────
  # Surveille les mises à jour de l'image de base (ex: python:3.12-slim).
  # Important pour le scan sécurité Trivy du workflow tencent.yml :
  # une image de base à jour = moins de vulnérabilités critiques.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    reviewers:
      - "Aissamohammedi88"
