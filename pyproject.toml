[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mental-terminal"
version = "3.0.0"
description = "Terminal virtuel Ubuntu/Unix en mémoire pour agents IA"
authors = [{name = "Aissa Mohammedi", email = "aissa.mohammedi@example.com"}]
license = {text = "NEXUS-OPEN-2.0"}
readme = "README.md"
keywords = ["terminal", "ubuntu", "virtual", "simulation", "bash", "apt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]
all = [
    "nexus-mental-terminal[api]",
    "nexus-mental-terminal[dev]",
]

[project.scripts]
nexus = "src.cli.main:cli"
nexus-term = "src.cli.interactive:run_interactive"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "ARG", "SIM"]
